<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo giá nguyên vật liệu – Kết Group</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="img/logos/favicon.png">
<link rel="apple-touch-icon" href="img/logos/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=20261107c">
<link rel="stylesheet" href="css/ncc-gia.css?v=20261107c">
<link rel="stylesheet" href="css/giay-trang.css?v=20261107c">
<script src="js/form-endpoint.js?v=20261107c"></script>
<script src="js/ncc-gia.js?v=20261107c" defer></script>
</head>
<body class="page-site page-static page-ncc">
<header class="ios-nav">
<div class="ios-nav-bar">
<img class="ncc-logo" src="img/logos/apple-touch-icon.png" alt="Kết Group">
<div class="ios-nav-title-group"><h1 class="ios-nav-title">Báo giá NVL</h1></div>
<span class="ios-nav-code" aria-hidden="true">KG</span>
</div>
</header>
<main class="apply-shell">
<div id="ncc-loading" class="apply-intro">Đang tải danh sách món…</div>
<div id="ncc-error" class="inset-card ncc-error" hidden><h2>Không tìm thấy bảng giá</h2><p>Anh/chị dùng link Kết gửi trong nhóm Zalo nhé. Cần hỗ trợ: Kết Group 089 6789768.</p></div>
<form id="ncc-form" class="apply-form" hidden novalidate>
<div class="ncc-hero inset-card">
<p class="ncc-kicker">Kết Group · Báo giá</p>
<h2 id="ncc-name">Nhà cung cấp</h2>
<p>Món nào <b>đổi giá</b> thì ghi giá mới, còn lại để trống (giữ giá cũ). Rồi bấm <b>Gửi</b>.</p>
<p id="ncc-last" class="ncc-last" hidden></p>
</div>
<ol id="ncc-items" class="ncc-items"></ol>
<div class="form-stack ncc-extra">
<label class="field"><span class="field-label">Tên người gửi (không bắt buộc)</span><input class="field-control" id="f-name" autocomplete="name"></label>
<label class="field"><span class="field-label">Ghi chú (không bắt buộc)</span><textarea class="field-control" id="f-note" rows="2" placeholder="VD: giá chưa VAT, món hết hàng…"></textarea></label>
</div>
<p id="ncc-msg" class="ncc-msg" role="alert"></p>
<button type="submit" class="apply-submit" id="ncc-submit">Gửi</button>
</form>
</main>
</body>
</html>
