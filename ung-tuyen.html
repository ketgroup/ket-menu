<main class="page-main">
<p class="prose-intro">Điền form bên dưới — đội ngũ Kết Group sẽ liên hệ khi có vị trí phù hợp. Thông tin chỉ dùng cho mục đích tuyển dụng.</p>
<div class="inset-group" style="padding-left:0;padding-right:0;padding-top:0">
<form id="apply-form" class="ios-form inset-card" action="https://formsubmit.co/ketcocktail@gmail.com" method="POST" enctype="multipart/form-data">
<input type="hidden" name="_subject" value="Ứng tuyển Kết Group">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="true">
<input type="hidden" name="_next" value="https://lanle102.github.io/ket-menu/ung-tuyen-thanh-cong.html">
<div class="form-field"><label for="full_name">Họ tên *</label><input id="full_name" name="Họ tên" type="text" required autocomplete="name"></div>
<div class="form-field"><label for="phone">Số điện thoại / Zalo *</label><input id="phone" name="Số điện thoại / Zalo" type="tel" required autocomplete="tel"></div>
<div class="form-field"><label for="birth_year">Năm sinh *</label><input id="birth_year" name="Năm sinh" type="number" inputmode="numeric" min="1960" max="2010" required></div>
<div class="form-field"><label for="venue">Quán muốn làm *</label><select id="venue" name="Quán muốn làm" required><option value="">Chọn quán</option><option>K1 · Kết Bar</option><option>K2 · Kết High</option><option>K5 · Kết Fai</option><option>K9 · Kết Underground</option><option>Quán nào cũng được</option></select></div>
<div class="form-field"><label for="position">Vị trí *</label><select id="position" name="Vị trí" required><option value="">Chọn vị trí</option><option>Bartender</option><option>Phục vụ</option><option>Bếp</option><option>Thu ngân</option><option>Khác</option></select></div>
<div class="form-field"><label for="schedule">Thời gian có thể làm *</label><select id="schedule" name="Thời gian có thể làm" required><option value="">Chọn thời gian</option><option>Full-time</option><option>Part-time (ca sáng)</option><option>Part-time (ca tối)</option><option>Part-time (linh hoạt)</option></select></div>
<div class="form-field"><label for="experience">Kinh nghiệm</label><textarea id="experience" name="Kinh nghiệm" placeholder="Mô tả ngắn kinh nghiệm làm việc (nếu có)"></textarea></div>
<div class="form-field"><label for="cv_file">File CV (PDF, Word hoặc ảnh, tối đa 5MB)</label><div class="file-picker"><input class="file-picker-input" id="cv_file" name="attachment" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"><label class="file-picker-btn" for="cv_file">Chọn file CV</label><span class="file-picker-name" data-file-name>Chưa chọn file</span></div></div>
<div class="form-field"><label for="profile_link">Link CV hoặc Facebook (hoặc dán link CV)</label><input id="profile_link" name="Link CV hoặc Facebook" type="url" inputmode="url" placeholder="https://"></div>
<div class="form-actions">
<p class="form-hint">Sau khi gửi, bạn có thể được chuyển qua bước xác minh chống spam.</p>
<button type="submit" class="ios-btn ios-btn--filled">Gửi đơn ứng tuyển</button>
</div>
</form>
</div>
